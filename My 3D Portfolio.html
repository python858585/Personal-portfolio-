<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My 3D Portfolio</title>
<meta name="description" content="A customizable 3D student portfolio.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✦%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600;800&family=Poppins:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c1f;--s:rgba(255,255,255,.07);--bd:rgba(255,255,255,.14);--t:#eef0ff;--m:#a3abcf;--p:#635bff;--a:#19b7a5;--r:20px;--f:'Space Grotesk',system-ui,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f1f3fb;--s:rgba(255,255,255,.72);--bd:rgba(20,30,60,.13);--t:#172033;--m:#566082;color-scheme:light}
@media(prefers-color-scheme:light){:root:not([data-theme]){--bg:#f1f3fb;--s:rgba(255,255,255,.72);--bd:rgba(20,30,60,.13);--t:#172033;--m:#566082}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--t);font:400 1rem/1.65 Inter,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:var(--f);margin:0;line-height:1.1}
a{color:inherit;text-decoration:none}:focus-visible{outline:2px solid var(--a);outline-offset:2px}
#c{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
nav{width:min(1100px,92%);margin:auto;height:62px;display:flex;align-items:center;gap:18px;justify-content:space-between}
.logo{font:700 1.1rem var(--f)}.nl{display:flex;gap:18px;overflow-x:auto;color:var(--m);font-size:.9rem;scrollbar-width:none}.nl a:hover{color:var(--t)}
.gear{border:1px solid var(--bd);background:var(--s);color:var(--t);border-radius:999px;padding:8px 14px;font:600 .85rem Inter;cursor:pointer;white-space:nowrap}
main{position:relative;z-index:1;width:min(1100px,92%);margin:auto}
section{padding:90px 0}.hero{min-height:100vh;display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center;padding-top:110px}
h1{font-size:clamp(2.4rem,6vw,4.6rem);letter-spacing:-.03em}h1 em{font-style:normal;background:linear-gradient(90deg,var(--p),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(1.8rem,3.6vw,2.7rem);letter-spacing:-.02em;margin-bottom:8px}.sub{color:var(--m);max-width:60ch;margin:0 0 28px}
.lead{color:var(--m);max-width:56ch;font-size:1.08rem;margin:18px 0 26px}.tg{color:var(--m);font-size:.95rem}
.row{display:flex;gap:12px;flex-wrap:wrap}.btn{border:1px solid var(--bd);background:var(--s);color:var(--t);padding:12px 20px;border-radius:calc(var(--r)*.6);font:600 .92rem Inter;cursor:pointer;transition:transform .2s}.btn:hover{transform:translateY(-2px)}
.pr{background:linear-gradient(135deg,var(--p),var(--a));border:0;color:#fff}
.card{background:var(--s);border:1px solid var(--bd);border-radius:var(--r);padding:24px;backdrop-filter:blur(16px);box-shadow:0 20px 50px rgba(0,0,0,.18)}
.tilt{position:relative;transform-style:preserve-3d;transition:transform .15s ease-out;will-change:transform}.glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.22),transparent 55%);opacity:0;transition:opacity .2s}.tilt:hover .glare{opacity:1}
.pc{max-width:330px;justify-self:center;width:100%}.ph{width:100%;aspect-ratio:1;border-radius:calc(var(--r)*.8);object-fit:cover;display:grid;place-items:center;font:700 4rem var(--f);background:linear-gradient(135deg,var(--p),var(--a));color:#fff}
.cap{padding-top:14px}.cap b{display:block;font-family:var(--f)}.cap small{color:var(--m)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.facts div{padding:12px;border:1px solid var(--bd);border-radius:12px}.facts small{display:block;color:var(--m)}
.sk{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}.bar{height:6px;border-radius:9px;background:var(--bd);margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--a));transition:width 1.1s ease}.in .bar i{width:var(--v)}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.fl button{border:1px solid var(--bd);background:var(--s);color:var(--t);border-radius:99px;padding:6px 14px;cursor:pointer;font:600 .82rem Inter}.fl .on{background:var(--p);border-color:var(--p);color:#fff}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;perspective:900px}.pj{cursor:pointer;padding:0;overflow:hidden;text-align:left;color:inherit;font:inherit;width:100%}.pa{height:130px;display:grid;place-items:center;font-size:2.8rem;background:linear-gradient(135deg,color-mix(in srgb,var(--p) 40%,transparent),color-mix(in srgb,var(--a) 40%,transparent))}.pb{padding:18px 20px}.pb p{color:var(--m);margin:6px 0 12px;font-size:.92rem}.tag{font-size:.78rem;background:color-mix(in srgb,var(--p) 25%,transparent);padding:4px 10px;border-radius:8px}
.tl{border-left:2px solid var(--bd);margin-left:8px;display:grid;gap:16px;padding-left:22px}.tl .card{position:relative}.tl .card:before{content:"";position:absolute;left:-31px;top:28px;width:14px;height:14px;border-radius:50%;background:var(--a)}
form{display:grid;gap:12px}input,textarea,select{width:100%;background:color-mix(in srgb,var(--bg) 60%,transparent);color:var(--t);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font:inherit}
.msg{min-height:1.4em;font-size:.9rem}.err{color:#ff7a7a}.ok{color:var(--a)}.soc{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
footer{position:relative;z-index:1;text-align:center;color:var(--m);padding:30px 0 50px;font-size:.88rem}
#modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:none;place-items:center;padding:20px}#modal.open{display:grid}#modal .card{max-width:520px;width:100%;background:var(--bg)}
#pn{position:fixed;top:0;right:0;height:100%;width:min(390px,100%);z-index:50;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(18px);border-left:1px solid var(--bd);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 40px;overflow-y:auto;transform:translateX(105%);transition:transform .3s}#pn.open{transform:none}
#pn details{border-bottom:1px solid var(--bd);padding:10px 0}#pn summary{font:700 1rem var(--f);cursor:pointer}#pn label{display:block;margin:10px 0 0;font-size:.82rem;color:var(--m)}#pn input[type=color]{height:38px;padding:2px}#pn input[type=checkbox]{width:auto}
.ol{display:flex;align-items:center;gap:8px;margin-top:8px}.ol span{flex:1}.ol button,.pre button{border:1px solid var(--bd);background:var(--s);color:var(--t);border-radius:8px;cursor:pointer;padding:4px 10px}.pre{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#cur{position:fixed;width:14px;height:14px;border-radius:50%;background:var(--a);pointer-events:none;z-index:99;mix-blend-mode:difference;transform:translate(-50%,-50%);opacity:0;transition:width .15s,height .15s}
#ld{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;font:700 1.4rem var(--f);transition:opacity .6s}
@media(max-width:760px){.hero,.g2{grid-template-columns:1fr}.hero{padding-top:100px}.logo{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="ld">Loading your portfolio…</div><div id="cur"></div>
<canvas id="c" aria-hidden="true"></canvas>
<header><nav><span class="logo">✦ Portfolio</span><div class="nl" id="nl"></div><button class="gear" id="gb" aria-expanded="false" aria-controls="pn">⚙ Customize</button></nav></header>
<main id="mn"></main>
<footer id="ft"></footer>
<div id="modal" role="dialog" aria-modal="true"></div>
<aside id="pn" aria-label="Customize panel">
<h2 style="font-size:1.4rem">Customize</h2><p class="tg">Changes appear live and save in this browser.</p>
<details open><summary>Your content</summary>
<label>Name<input data-k="s.name"></label><label>Tagline<input data-k="s.tag"></label>
<label>Course<input data-k="s.course"></label><label>Semester<input data-k="s.sem"></label>
<label>College<input data-k="s.college"></label><label>City<input data-k="s.city"></label>
<label>Email<input data-k="s.email" type="email"></label>
<label>About you<textarea data-k="s.about" rows="4"></textarea></label>
<label>Photo<input type="file" accept="image/*" id="pf"></label>
<label>Skills (name:level, comma separated)<textarea data-k="s.skills" rows="3"></textarea></label>
<label>Projects (one per line: icon | title | description | tag | link)<textarea data-k="s.projects" rows="6"></textarea></label>
<label>Education (one per line: degree | place | year)<textarea data-k="s.edu" rows="3"></textarea></label>
<label>GitHub link<input data-k="s.github"></label><label>LinkedIn link<input data-k="s.linkedin"></label><label>Instagram link<input data-k="s.instagram"></label></details>
<details><summary>Theme</summary>
<label>Mode<select data-k="theme.mode"><option value="dark">Dark</option><option value="light">Light</option><option value="auto">Match my device</option></select></label>
<div class="pre" id="pre"></div>
<label>Primary color<input type="color" data-k="theme.p"></label><label>Accent color<input type="color" data-k="theme.a"></label><label>Background color<input type="color" data-k="theme.bg"></label>
<label>Font<select data-k="theme.font"><option value="'Space Grotesk'">Space Grotesk</option><option value="Inter">Inter</option><option value="Poppins">Poppins</option><option value="'Playfair Display'">Playfair Display</option></select></label>
<label>Corner roundness<input type="range" min="4" max="34" data-k="theme.r"></label></details>
<details><summary>3D scene</summary>
<label>Scene<select data-k="scene.type"><option value="shapes">Floating shapes</option><option value="particles">Particle galaxy</option><option value="waves">Wave field</option></select></label>
<label>Speed<input type="range" min="0.2" max="3" step="0.1" data-k="scene.speed"></label>
<label>Size and intensity<input type="range" min="0.5" max="1.6" step="0.1" data-k="scene.intensity"></label>
<label>Quality<select data-k="scene.quality"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></label></details>
<details><summary>Sections</summary><div id="ol"></div></details>
<details><summary>Backup</summary><div class="row" style="margin-top:10px"><button class="btn" id="ex">Export JSON</button><label class="btn" style="margin:0;color:var(--t)">Import JSON<input type="file" accept=".json" id="im" hidden></label><button class="btn" id="rs">Reset all</button></div></details>
</aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const D={theme:{mode:'dark',p:'#635bff',a:'#19b7a5',bg:'',r:20,font:"'Space Grotesk'"},scene:{type:'shapes',speed:1,intensity:1,quality:'medium'},order:['hero','about','skills','projects','education','contact'],hidden:[],
s:{name:'Your Name',tag:'I’m learning to build things that work.',course:'B.Tech Computer Science',sem:'1st Semester',college:'Your College Name',city:'Your City, India',email:'your.email@example.com',photo:'',
about:'Hello! I am a first-semester Computer Science student who enjoys learning how technology works and building small projects. I am exploring programming, web development and problem solving, and this portfolio is the first step in sharing my journey.',
skills:'C Programming:70, HTML:80, CSS:75, Problem Solving:65, Communication:70, Teamwork:85',
projects:'🌐|My First Portfolio|A personal website to introduce myself and show my learning journey.|HTML/CSS|https://github.com/\n🧮|Simple Calculator|A beginner-friendly calculator for basic arithmetic.|C Programming|\n📚|Student Record|A small program that stores and displays student information.|C Programming|',
edu:'B.Tech in Computer Science and Engineering|Your College Name|Expected graduation: 20XX',github:'',linkedin:'',instagram:''}};
const K='pf3d-v1',$=q=>document.querySelector(q),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=JSON.parse(JSON.stringify(D));
try{const o=JSON.parse(localStorage.getItem(K)||'null');if(o)for(const k in o)S[k]=typeof o[k]==='object'&&!Array.isArray(o[k])?{...S[k],...o[k]}:o[k]}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches,NAMES={hero:'Home',about:'About',skills:'Skills',projects:'Projects',education:'Education',contact:'Contact'};
const PRE={Aurora:['#635bff','#19b7a5'],Sunset:['#ff6b6b','#ffb347'],Ocean:['#0ea5e9','#22d3ee'],Forest:['#16a34a','#a3e635'],Rose:['#ec4899','#f59e0b'],Mono:['#c7cbd6','#7d8499'],Neon:['#a855f7','#22ff88'],Lava:['#ef4444','#f97316']};
let ftag='All';
const lines=t=>t.split('\n').filter(l=>l.trim()),parts=l=>l.split('|').map(x=>x.trim());
const url=u=>/^https?:\/\//.test(u||'')?u:'';
const SEC={
hero(s){const ph=s.photo?`<img class="ph" src="${esc(s.photo)}" alt="Profile photo of ${esc(s.name)}">`:`<div class="ph">${esc((s.name||'?')[0])}</div>`;
return `<section id="hero" class="hero"><div><p class="tg">${esc(s.sem)}, ${esc(s.course)}</p><h1>Hi, I’m <em>${esc(s.name)}</em>.<br>${esc(s.tag)}</h1><p class="lead">${esc(s.about.length>170?s.about.slice(0,170)+'…':s.about)}</p><div class="row"><a class="btn pr" href="#projects">See my projects</a><a class="btn" href="#contact">Contact me</a></div></div><div class="card tilt pc">${ph}<div class="cap"><b>${esc(s.name)}</b><small>${esc(s.college)}</small></div><i class="glare"></i></div></section>`},
about(s){return `<section id="about"><h2>About me</h2><p class="sub">A short introduction and the basics.</p><div class="g2"><article class="card tilt"><h3>Introduction</h3><p style="color:var(--m)">${esc(s.about)}</p><i class="glare"></i></article><article class="card tilt"><h3>Quick facts</h3><div class="facts" style="margin-top:12px">${[['Course',s.course],['Semester',s.sem],['College',s.college],['Location',s.city]].map(f=>`<div><small>${f[0]}</small><b>${esc(f[1])}</b></div>`).join('')}</div><i class="glare"></i></article></div></section>`},
skills(s){const a=s.skills.split(',').map(x=>x.trim()).filter(Boolean).map(x=>{const[n,v]=x.split(':');return[n.trim(),Math.min(100,Math.max(5,+v||70))]});
return `<section id="skills"><h2>Skills</h2><p class="sub">What I am learning and practicing right now. Hover a card to tilt it.</p><div class="sk">${a.map(([n,v])=>`<div class="card tilt" title="${esc(n)}: ${v}%"><b>${esc(n)}</b><div style="color:var(--m);font-size:.85rem">${v}% comfortable</div><div class="bar"><i style="--v:${v}%"></i></div><i class="glare"></i></div>`).join('')}</div></section>`},
projects(s){const p=lines(s.projects).map(parts),tags=['All',...new Set(p.map(x=>x[3]).filter(Boolean))];
return `<section id="projects"><h2>Projects</h2><p class="sub">Select a project to read more.</p><div class="fl">${tags.map(t=>`<button data-tag="${esc(t)}" class="${t===ftag?'on':''}">${esc(t)}</button>`).join('')}</div><div class="pg">${p.map((x,i)=>(ftag==='All'||x[3]===ftag)?`<button class="card tilt pj" data-i="${i}"><div class="pa">${esc(x[0])}</div><div class="pb"><h3>${esc(x[1])}</h3><p>${esc(x[2])}</p><span class="tag">${esc(x[3])}</span></div><i class="glare"></i></button>`:'').join('')}</div></section>`},
education(s){return `<section id="education"><h2>Education</h2><p class="sub">Where I study.</p><div class="tl">${lines(s.edu).map(parts).map(e=>`<div class="card"><h3>${esc(e[0])}</h3><p style="margin:4px 0;color:var(--m)">${esc(e[1])}</p><p style="margin:0;color:var(--m)">${esc(e[2])}</p></div>`).join('')}</div></section>`},
contact(s){const l=[['GitHub',s.github],['LinkedIn',s.linkedin],['Instagram',s.instagram]].filter(x=>url(x[1]));
return `<section id="contact"><h2>Let’s talk</h2><p class="sub">Have an idea or a question? Send a message and your email app will open with it filled in.</p><div class="card"><form id="cf" novalidate><input name="n" placeholder="Your name" aria-label="Your name"><input name="e" type="email" placeholder="Your email" aria-label="Your email"><textarea name="m" rows="4" placeholder="Your message" aria-label="Your message"></textarea><button class="btn pr" type="submit">Send message</button><div class="msg" id="cm" role="status"></div></form><div class="soc">${l.map(x=>`<a class="btn" target="_blank" rel="noopener noreferrer" href="${esc(x[1])}">${x[0]}</a>`).join('')}</div></div></section>`}};
function render(first){const vis=S.order.filter(i=>!S.hidden.includes(i));
$('#mn').innerHTML=vis.map(i=>SEC[i](S.s)).join('');
$('#nl').innerHTML=vis.map(i=>`<a href="#${i}">${NAMES[i]}</a>`).join('');
$('#ft').textContent=`Made by ${S.s.name}, ${new Date().getFullYear()}`;document.title=`${S.s.name} | Portfolio`;
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.card,.bar').forEach(el=>first?io.observe(el):el.classList.add('in'));
const cf=$('#cf');if(cf)cf.onsubmit=ev=>{ev.preventDefault();const f=new FormData(cf),m=$('#cm'),n=f.get('n').trim(),e=f.get('e').trim(),b=f.get('m').trim();
if(!n||!/^\S+@\S+\.\S+$/.test(e)||b.length<5){m.className='msg err';m.textContent='Add your name, a valid email and a message of at least 5 characters.';return}
m.className='msg ok';m.textContent='Opening your email app…';location.href=`mailto:${S.s.email}?subject=${encodeURIComponent('Message from '+n)}&body=${encodeURIComponent(b+'\n\nReply to: '+e)}`}}
function theme(){const T=S.theme,r=document.documentElement,m=T.mode==='auto'?(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'):T.mode;
r.dataset.theme=m;r.style.setProperty('--p',T.p);r.style.setProperty('--a',T.a);r.style.setProperty('--r',T.r+'px');r.style.setProperty('--f',`${T.font},system-ui,sans-serif`);
T.bg?r.style.setProperty('--bg',T.bg):r.style.removeProperty('--bg')}
/* 3D scene */
let R,sc,cam,grp,W3=true,tm=0,mx=0,my=0,sp=0,wv;
try{R=new THREE.WebGLRenderer({canvas:$('#c'),antialias:true,alpha:true});sc=new THREE.Scene();cam=new THREE.PerspectiveCamera(60,1,.1,100);cam.position.z=9;grp=new THREE.Group();sc.add(grp)}catch(e){W3=false;$('#c').style.display='none'}
function build(){if(!W3)return;wv=null;while(grp.children.length){const o=grp.children.pop();o.geometry&&o.geometry.dispose();o.material&&o.material.dispose()}
const Q=S.scene.quality,q={low:.4,medium:.8,high:1.4}[Q],c1=new THREE.Color(S.theme.p),c2=new THREE.Color(S.theme.a),t=S.scene.type;
R.setPixelRatio(Math.min(devicePixelRatio,{low:1,medium:1.5,high:2}[Q]));grp.scale.setScalar(S.scene.intensity);
if(t==='particles'){const n=Math.round(2500*q),p=new Float32Array(n*3),c=new Float32Array(n*3);
for(let i=0;i<n;i++){const r=3+Math.random()*10,a=Math.random()*6.283,b=Math.acos(2*Math.random()-1);p.set([r*Math.sin(b)*Math.cos(a),r*Math.sin(b)*Math.sin(a)*1.6,r*Math.cos(b)],i*3);(Math.random()<.5?c1:c2).toArray(c,i*3)}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(c,3));grp.add(new THREE.Points(g,new THREE.PointsMaterial({size:.06,vertexColors:true,transparent:true,opacity:.9})))}
else if(t==='waves'){const N=Math.round(60*Math.sqrt(q)),p=new Float32Array(N*N*3);let k=0;for(let i=0;i<N;i++)for(let j=0;j<N;j++){p[k++]=(i-N/2)*.5;p[k++]=0;p[k++]=(j-N/2)*.5}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));const m=new THREE.Points(g,new THREE.PointsMaterial({size:.07,color:c1}));m.position.y=-2;m.rotation.x=.25;grp.add(m);wv={m,N}}
else{const G=[()=>new THREE.IcosahedronGeometry(1),()=>new THREE.OctahedronGeometry(1),()=>new THREE.TorusGeometry(.7,.25,10,20),()=>new THREE.TetrahedronGeometry(1.1)];
for(let i=0;i<Math.round(24*q)+4;i++){const m=new THREE.Mesh(G[i%4](),new THREE.MeshBasicMaterial({color:i%2?c1:c2,wireframe:true,transparent:true,opacity:.7}));m.position.set((Math.random()-.5)*20,(Math.random()-.5)*16,(Math.random()-.5)*8-1);m.scale.setScalar(.5+Math.random()*1.3);m.userData.r=[Math.random()*.01,Math.random()*.01];grp.add(m)}
const k=new THREE.Mesh(new THREE.TorusKnotGeometry(1.5,.4,90,10),new THREE.MeshBasicMaterial({color:c1,wireframe:true,transparent:true,opacity:.5}));k.position.set(3.5,0,-1);k.userData.r=[.004,.006];grp.add(k)}}
function size(){if(!W3)return;R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
function loop(){requestAnimationFrame(loop);if(!W3)return;tm+=.016*S.scene.speed*(RM?.15:1);
const mh=document.documentElement.scrollHeight-innerHeight,p=mh>0?scrollY/mh:0;sp+=(p-sp)*.06;
grp.rotation.y=sp*Math.PI*1.5+tm*.05;cam.position.x+=(mx*1.5-cam.position.x)*.05;cam.position.y+=(-sp*3+my-cam.position.y)*.05;cam.lookAt(0,cam.position.y*.4,0);
grp.children.forEach(o=>{const r=o.userData.r;if(r){o.rotation.x+=r[0]*S.scene.speed;o.rotation.y+=r[1]*S.scene.speed}});
if(wv){const a=wv.m.geometry.attributes.position,N=wv.N;let k=1;for(let i=0;i<N;i++)for(let j=0;j<N;j++){a.array[k]=Math.sin(i*.3+tm*2)*Math.cos(j*.3+tm*1.5)*.8;k+=3}a.needsUpdate=true}
R.render(sc,cam)}
/* panel */
const get=k=>k.split('.').reduce((o,x)=>o[x],S),set=(k,v)=>{const a=k.split('.'),l=a.pop();a.reduce((o,x)=>o[x],S)[l]=v};
function fill(){document.querySelectorAll('#pn [data-k]').forEach(e=>{let v=get(e.dataset.k);if(e.type==='color'&&!v)v='#0a0c1f';e.value=v});
$('#ol').innerHTML=S.order.map(i=>`<div class="ol"><input type="checkbox" data-h="${i}" aria-label="Show ${NAMES[i]}" ${S.hidden.includes(i)?'':'checked'}><span>${NAMES[i]}</span><button data-mv="${i}" data-d="-1" aria-label="Move ${NAMES[i]} up">↑</button><button data-mv="${i}" data-d="1" aria-label="Move ${NAMES[i]} down">↓</button></div>`).join('')}
$('#pre').innerHTML=Object.keys(PRE).map(n=>`<button data-pre="${n}">${n}</button>`).join('');
$('#pn').addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;let v=e.target.value;if(e.target.type==='range')v=+v;set(k,v);theme();render();save();if(/^scene\.(type|quality|intensity)|theme\.[pa]$/.test(k))build()});
$('#pn').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.pre){[S.theme.p,S.theme.a]=PRE[b.dataset.pre];theme();build();fill();render();save()}
if(b.dataset.mv){const i=S.order.indexOf(b.dataset.mv),j=i+ +b.dataset.d;if(j>=0&&j<S.order.length){[S.order[i],S.order[j]]=[S.order[j],S.order[i]];fill();render();save()}}});
$('#pn').addEventListener('change',e=>{const h=e.target.dataset.h;if(h){S.hidden=e.target.checked?S.hidden.filter(x=>x!==h):[...S.hidden,h];render();save()}});
$('#pf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,600/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.s.photo=c.toDataURL('image/jpeg',.85);render();save()};im.src=r.result};r.readAsDataURL(f)};
$('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='portfolio-settings.json';a.click()};
$('#im').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);S=JSON.parse(JSON.stringify(D));for(const k in o)S[k]=typeof o[k]==='object'&&!Array.isArray(o[k])?{...S[k],...o[k]}:o[k];fill();theme();render();build();save()}catch(x){alert('That file is not valid portfolio settings.')}})};
$('#rs').onclick=()=>{if(confirm('Reset everything to the defaults?')){S=JSON.parse(JSON.stringify(D));fill();theme();render();build();save()}};
$('#gb').onclick=()=>{const o=$('#pn').classList.toggle('open');$('#gb').setAttribute('aria-expanded',o)};
/* interactions */
let cur=null;const rs=el=>{if(el)el.style.transform=''};
document.addEventListener('pointermove',e=>{mx=e.clientX/innerWidth*2-1;my=-(e.clientY/innerHeight*2-1);const c=$('#cur');if(matchMedia('(hover:hover)').matches){c.style.opacity=1;c.style.left=e.clientX+'px';c.style.top=e.clientY+'px'}
const el=e.target.closest&&e.target.closest('.tilt');if(cur&&cur!==el)rs(cur);cur=el;if(el&&!RM){const b=el.getBoundingClientRect(),x=(e.clientX-b.left)/b.width,y=(e.clientY-b.top)/b.height;el.style.transform=`perspective(800px) rotateX(${(.5-y)*14}deg) rotateY(${(x-.5)*14}deg) scale(1.02)`;el.style.setProperty('--gx',x*100+'%');el.style.setProperty('--gy',y*100+'%')}});
document.addEventListener('pointerleave',()=>rs(cur));
addEventListener('deviceorientation',e=>{if(e.gamma!=null){mx=Math.max(-1,Math.min(1,e.gamma/30));my=Math.max(-1,Math.min(1,(e.beta-45)/30))}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-tag]');if(t){ftag=t.dataset.tag;render();return}
const p=e.target.closest('.pj');if(p){const x=parts(lines(S.s.projects)[+p.dataset.i]),m=$('#modal'),u=url(x[4]);m.innerHTML=`<div class="card"><div style="font-size:3rem">${esc(x[0])}</div><h2 style="font-size:1.7rem;margin-top:8px">${esc(x[1])}</h2><p style="color:var(--m)">${esc(x[2])}</p><span class="tag">${esc(x[3])}</span><div class="row" style="margin-top:18px">${u?`<a class="btn pr" target="_blank" rel="noopener noreferrer" href="${esc(u)}">${/instagram/.test(u)?'View on Instagram':/github/.test(u)?'View on GitHub':'Open link'}</a>`:''}<button class="btn" id="mc">Close</button></div></div>`;m.classList.add('open');$('#mc').focus();return}
if(e.target.id==='modal'||e.target.id==='mc')$('#modal').classList.remove('open')});
addEventListener('keydown',e=>{if(e.key==='Escape'){$('#modal').classList.remove('open');$('#pn').classList.remove('open')}});
addEventListener('resize',size);
theme();render(true);fill();size();build();loop();
addEventListener('load',()=>setTimeout(()=>{const l=$('#ld');l.style.opacity=0;setTimeout(()=>l.remove(),650)},500));
